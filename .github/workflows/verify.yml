name: Verify and build
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart tool/preflight.dart ${{ runner.os == 'macOS' && 'macos' || 'windows' }}
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - if: runner.os == 'macOS'
        run: |
          python -m venv .venv-ssh-test
          .venv-ssh-test/bin/python -m pip install asyncssh==2.24.1
          PORTLINK_SSH_TEST_PYTHON="$PWD/.venv-ssh-test/bin/python" flutter test test/ssh_integration_test.dart --concurrency=1
      - name: Record runner architecture
        run: echo "${{ runner.os }} / ${{ runner.arch }}"
      - if: runner.os == 'macOS'
        run: flutter build macos --release
      - if: runner.os == 'Windows'
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: portlink-${{ runner.os }}-unsigned
          path: |
            build/macos/Build/Products/Release/*.app
            build/windows/*/runner/Release/
          if-no-files-found: error

  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android native toolchains
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: flutter pub get
      - run: dart tool/preflight.dart android
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: portlink-android-debug-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
