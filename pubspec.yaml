name: portlink
description: Minimal local SSH forwarding for port 3080.
publish_to: none
version: 0.1.3+4

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.2
  tray_manager: ^0.8.0
  nativeapi: 0.5.2
  window_manager: ^0.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
